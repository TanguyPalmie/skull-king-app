version: '3.8'

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taggy_test
      POSTGRES_PASSWORD: taggy_test
      POSTGRES_DB: taggy_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taggy_test"]
      interval: 3s
      timeout: 2s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data

  api-test:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api.dev
    environment:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: postgres://taggy_test:taggy_test@postgres-test:5432/taggy_test
      JWT_SECRET: test-jwt-secret
      JWT_REFRESH_SECRET: test-refresh-secret
      CORS_ORIGIN: http://localhost:3000
      SMS_PROVIDER: console
      EMAIL_PROVIDER: console
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
    depends_on:
      postgres-test:
        condition: service_healthy
    command: sh -c "cd apps/api && pnpm migrate && pnpm seed && pnpm test"

  web-test:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web.dev
    environment:
      VITE_API_URL: http://localhost:4000
    command: sh -c "cd apps/web && pnpm test"
