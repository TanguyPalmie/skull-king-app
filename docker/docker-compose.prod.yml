services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taggy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taggy_prod_s3cret}
      POSTGRES_DB: ${POSTGRES_DB:-taggy}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taggy}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api.prod
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-taggy}:${POSTGRES_PASSWORD:-taggy_prod_s3cret}@postgres:5432/${POSTGRES_DB:-taggy}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-in-production-too}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      SMS_PROVIDER: ${SMS_PROVIDER:-console}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r => r.ok ? process.exit(0) : process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web.prod
    ports:
      - "443:443"
      - "80:80"
    depends_on:
      - api
    restart: always
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro

volumes:
  pgdata_prod:
